version: '3.8'

services:
  readest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: readest-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .readest.env
    volumes:
      # 书籍存储
      - ./books:/app/books
      # 配置持久化
      - ./config:/app/config
      # 批注持久化，放在appdata下
      - ./books/.readest:/app/books/.readest
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

